name: CoinValues
options:
  bundleIdPrefix: com.coinvalues
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: ZUCC9R4PP4
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  CoinValues:
    type: application
    platform: iOS
    sources:
      - path: CoinValues
        excludes:
          - "Resources/Products.storekit"
      - path: CoinValues/Resources/Products.storekit
        buildPhase: none
    info:
      path: CoinValues/Info.plist
      properties:
        CFBundleDisplayName: Coin Values
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.reference
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Coin Values uses the camera to photograph the front and back of your coins so they can be identified.
        DevBypassToken: $(DEV_BYPASS_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coinvalues.identifier
        PRODUCT_NAME: CoinValues
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  CoinValuesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoinValuesTests
      - path: CoinValues/Resources/Products.storekit
        buildPhase: resources
    dependencies:
      - target: CoinValues
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.coinvalues.identifier.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CoinValues.app/CoinValues
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  CoinValues:
    build:
      targets:
        CoinValues: all
    test:
      targets:
        - CoinValuesTests
    run:
      config: Debug
      storeKitConfiguration: CoinValues/Resources/Products.storekit
    archive:
      config: Release
